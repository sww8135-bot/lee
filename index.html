<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow-md my-8">
  <h2 class="text-2xl font-bold text-center text-blue-800 mb-2">แบบประเมินความพึงพอใจ</h2>
  <p class="text-center text-gray-600 mb-6">คู่มือการใช้งานคอมพิวเตอร์เบื้องต้น องค์การบริหารส่วนจังหวัด (อบจ.)</p>
  
  <form action="#" method="POST">
    <div class="mb-6">
      <label class="block font-semibold text-gray-700 mb-2">1. สถานะของท่าน:</label>
      <select class="w-full p-2 border rounded-md">
        <option>บุคลากร อบจ.</option>
        <option>ประชาชนทั่วไป</option>
        <option>อื่น ๆ</option>
      </select>
    </div>

    <div class="mb-6">
      <label class="block font-semibold text-gray-700 mb-2">2. ความถูกต้องและเข้าใจง่ายของเนื้อหาในคู่มือ:</label>
      <div class="flex justify-between text-sm text-gray-600 px-2">
        <label><input type="radio" name="q1" value="5"> มากที่สุด (5)</label>
        <label><input type="radio" name="q1" value="4"> มาก (4)</label>
        <label><input type="radio" name="q1" value="3"> ปานกลาง (3)</label>
        <label><input type="radio" name="q1" value="2"> น้อย (2)</label>
        <label><input type="radio" name="q1" value="1"> น้อยที่สุด (1)</label>
      </div>
    </div>

    <div class="mb-6">
      <label class="block font-semibold text-gray-700 mb-2">3. ข้อเสนอแนะเพิ่มเติม:</label>
      <textarea rows="3" class="w-full p-2 border rounded-md" placeholder="พิมพ์ข้อเสนอแนะของคุณที่นี่..."></textarea>
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-md font-semibold hover:bg-blue-700 transition">
      ส่งแบบประเมิน
    </button>
  </form>
</div>
