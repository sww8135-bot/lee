<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แอปบันทึกรายรับ-รายจ่าย (โหมดประหยัดเวลา)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 p-4">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">💰 บันทึกรายรับ - รายจ่าย</h1>
        </header>

        <!-- ฟอร์มกรอกข้อมูล -->
        <div class="bg-white p-6 rounded-2xl shadow mb-8 border border-gray-100">
            <h3 class="text-md font-semibold mb-4 text-gray-700">✍️ เพิ่มรายการใหม่ (ระบบจดจำประวัติ)</h3>
            <form id="transactionForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                
                <div class="grid grid-cols-2 gap-2">
                    <select id="type" class="border rounded-lg p-2 text-sm bg-gray-50">
                        <option value="income">รายรับ (+)</option>
                        <option value="expense">รายจ่าย (-)</option>
                    </select>
                    <select id="account" class="border rounded-lg p-2 text-sm bg-gray-50">
                        <option value="cash">เงินสด</option>
                        <option value="bank">บัญชีธนาคาร</option>
                    </select>
                </div>

                <!-- ช่องรายละเอียดที่จำรายการเก่าได้ -->
                <div>
                    <input type="text" id="description" list="descSuggestions" required placeholder="พิมพ์รายละเอียด..." class="w-full border rounded-lg p-2 text-sm outline-indigo-400">
                    <datalist id="descSuggestions"></datalist>
                </div>

                <!-- ช่องจำนวนเงิน พร้อมปุ่มด่วน -->
                <div class="sm:col-span-2">
                    <input type="number" id="amount" required placeholder="จำนวนเงิน" class="w-full border rounded-lg p-2 text-sm mb-2">
                    <div class="flex gap-2">
                        <button type="button" onclick="addAmount(20)" class="bg-gray-200 px-3 py-1 rounded-full text-xs hover:bg-indigo-100">+20</button>
                        <button type="button" onclick="addAmount(50)" class="bg-gray-200 px-3 py-1 rounded-full text-xs hover:bg-indigo-100">+50</button>
                        <button type="button" onclick="addAmount(100)" class="bg-gray-200 px-3 py-1 rounded-full text-xs hover:bg-indigo-100">+100</button>
                        <button type="button" onclick="addAmount(500)" class="bg-gray-200 px-3 py-1 rounded-full text-xs hover:bg-indigo-100">+500</button>
                        <button type="button" onclick="document.getElementById('amount').value=''" class="text-rose-500 text-xs ml-auto">ล้างตัวเลข</button>
                    </div>
                </div>

                <div class="sm:col-span-2">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700">บันทึกรายการ</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        const descInput = document.getElementById('description');
        const descList = document.getElementById('descSuggestions');
        const amountInput = document.getElementById('amount');

        // ฟังก์ชันช่วยบวกเลขด่วน
        function addAmount(val) {
            const current = parseFloat(amountInput.value) || 0;
            amountInput.value = current + val;
        }

        // อัปเดตรายการที่เคยพิมพ์ไว้ (Autocomplete)
        function updateSuggestions() {
            const uniqueDescs = [...new Set(transactions.map(t => t.description))];
            descList.innerHTML = '';
            uniqueDescs.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                descList.appendChild(opt);
            });
        }

        document.getElementById('transactionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newTransaction = {
                id: Date.now(),
                type: document.getElementById('type').value,
                account: document.getElementById('account').value,
                amount: parseFloat(amountInput.value),
                description: descInput.value,
                date: new Date().toISOString().slice(0, 10)
            };
            transactions.push(newTransaction);
            localStorage.setItem('transactions', JSON.stringify(transactions));
            
            // รีเซ็ตฟอร์ม
            amountInput.value = '';
            descInput.value = '';
            updateSuggestions();
            alert("บันทึกสำเร็จ!");
        });

        // โหลดรายการเดิมมาแสดงตอนเริ่ม
        updateSuggestions();
    </script>
</body>
</html>
